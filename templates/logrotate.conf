# pi-home-stack - managed by install.sh, changes may be overwritten.

/var/log/pi-home-stack.log {
    monthly
    rotate 6
    compress
    delaycompress
    missingok
    notifempty
    create 0640 root root
}

/var/log/nginx/pi-home-stack.*.log {
    weekly
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
    create 0640 www-data adm
    sharedscripts
    postrotate
        # USR1 makes nginx reopen its log files without dropping connections.
        [ -f /run/nginx.pid ] && kill -USR1 "$(cat /run/nginx.pid)"
    endscript
}
