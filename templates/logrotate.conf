# pi-home-stack - managed by install.sh, changes may be overwritten.
#
# Only this stack's own log. The nginx logs under /var/log/nginx are
# deliberately NOT declared here: Debian's /etc/logrotate.d/nginx already
# rotates /var/log/nginx/*.log, with its own USR1 postrotate.
#
# Naming them a second time is not merely redundant - logrotate treats a
# duplicate entry as an error, skips the whole file it found it in, and exits
# non-zero. The result was that logrotate.service failed and NOTHING on the
# system rotated any more, including the system logs.

/var/log/pi-home-stack.log {
    monthly
    rotate 6
    compress
    delaycompress
    missingok
    notifempty
    create 0640 root root
}
