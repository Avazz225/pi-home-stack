// pi-home-stack - managed by install.sh, changes may be overwritten.
//
// Be precise about what these origins mean, because the previous comment here
// claimed more than they deliver: the two Debian lines really are the security
// pocket. The Raspbian and Raspberry Pi Foundation lines are the whole archive
// of those origins - that is where the kernel and the firmware come from, and
// they are not limited to security fixes. Leaving them in means the kernel can
// be replaced unattended, and the next reboot by anyone activates a kernel
// nobody has seen. See the blacklist below.

Unattended-Upgrade::Origins-Pattern {
        "origin=Debian,codename=${distro_codename},label=Debian-Security";
        "origin=Debian,codename=${distro_codename}-security,label=Debian-Security";
        "origin=Raspbian,codename=${distro_codename},label=Raspbian";
        "origin=Raspberry Pi Foundation,codename=${distro_codename},label=Raspberry Pi Foundation";
};

// Packages that would interrupt a running backup or drop the network are better
// updated by hand. The kernel and the firmware belong here unless you asked
// otherwise during installation: a boot medium plus a fresh kernel is the one
// combination that can leave the Pi unreachable, and it does so at the next
// reboot rather than at install time, which makes the cause hard to see.
//
// The price is explicit: kernel security fixes then wait for you. Check with
//     apt list --upgradable
Unattended-Upgrade::Package-Blacklist {
@KERNEL_BLACKLIST@};

Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
Unattended-Upgrade::Remove-Unused-Dependencies "true";
Unattended-Upgrade::Automatic-Reboot "@AUTO_REBOOT@";
Unattended-Upgrade::Automatic-Reboot-WithUsers "false";
Unattended-Upgrade::Automatic-Reboot-Time "@AUTO_REBOOT_TIME@";
