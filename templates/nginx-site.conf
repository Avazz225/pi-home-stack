# pi-home-stack - managed by install.sh, changes may be overwritten.
# Per-module locations live in /etc/nginx/pi-home-stack/ and are included below,
# so backup, network monitor and friends register themselves without touching
# this file.

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name @WEB_SERVER_NAME@;
    root @WEB_ROOT@;
    index index.html;

    access_log /var/log/nginx/pi-home-stack.access.log;
    error_log  /var/log/nginx/pi-home-stack.error.log;

    # Meant for a local network: keeps the interface out of other sites' frames
    # and turns off MIME sniffing.
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # No large uploads expected; the APIs only exchange JSON.
    client_max_body_size 4m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The status report is rewritten every minute - never cache it, or the
    # interface shows stale numbers for minutes at a time.
    location = /status.json {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    include /etc/nginx/pi-home-stack/*.conf;
}
