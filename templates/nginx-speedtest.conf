# pi-home-stack - the speed-test API.
#
# Two locations, and the reason is a collision: Pi-hole v6 serves its own REST
# API at /api/, and its web interface calls it from there. That location is not
# negotiable, so the speed test moves out of the way.
#
#   /speedtest-api/            the clean path - use this in new builds
#   /api/speed-test-results    the one path the deployed bundle asks for
#
# The second one works because nginx picks the LONGEST matching prefix, not the
# first: a request for /api/speed-test-results lands here, everything else under
# /api/ still goes to Pi-hole. It exists so an already-built dashboard keeps
# working; set REACT_APP_NW_API_ENDPOINT=/speedtest-api and it becomes dead
# weight that can be dropped.

location /speedtest-api/ {
    proxy_pass http://127.0.0.1:@SPEEDTEST_PORT@/;
    proxy_set_header Host            $host;
    proxy_set_header X-Real-IP       $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location /api/speed-test-results {
    proxy_pass http://127.0.0.1:@SPEEDTEST_PORT@/speed-test-results;
    proxy_set_header Host            $host;
    proxy_set_header X-Real-IP       $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
