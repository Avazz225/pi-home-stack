# pi-home-stack - HashiCorp Vault.
#
# Vault speaks its own TLS on @VAULT_PORT@; nginx only forwards so the UI is
# reachable under the same host as everything else. The upstream scheme follows
# the Vault configuration.

location /vault/ {
    proxy_pass @VAULT_SCHEME@://127.0.0.1:@VAULT_PORT@/;
    proxy_set_header Host            $host;
    proxy_set_header X-Real-IP       $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Vault's self-signed certificate is not in any trust store
    proxy_ssl_verify off;

    # The UI keeps a websocket open for events
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";
}
