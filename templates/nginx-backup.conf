# pi-home-stack - backup API.
# This API accepts credentials, so it does not belong on the open internet. If you
# expose the Pi externally, add an access restriction here, for example:
#     allow 192.168.0.0/16; deny all;

location /backup-api/ {
    proxy_pass http://127.0.0.1:@BACKUP_API_PORT@/;
    proxy_set_header Host            $host;
    proxy_set_header X-Real-IP       $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
}
