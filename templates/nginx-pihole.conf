# pi-home-stack - Pi-hole behind nginx.
# Pi-hole listens on @PIHOLE_PORT@ so nginx can have port 80.

location /admin/ {
    proxy_pass http://127.0.0.1:@PIHOLE_PORT@/admin/;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Typed without the trailing slash this would 404 instead of opening the UI.
location = /admin {
    return 301 /admin/;
}

# Pi-hole's block page and API paths live outside /admin/.
location /api/ {
    proxy_pass http://127.0.0.1:@PIHOLE_PORT@/api/;
    proxy_set_header Host            $host;
    proxy_set_header X-Real-IP       $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
