# pi-home-stack - managed by install.sh, changes may be overwritten.
# Pulled in through an include line in /etc/samba/smb.conf.

[global]
    # SMB1 has been unsafe for years and modern clients refuse it anyway;
    # raising the minimum to SMB2 turns it off for good.
    server min protocol = SMB2
    client min protocol = SMB2
    # Offer encryption without requiring it - older clients (smart TVs, cameras)
    # would otherwise drop out with no comprehensible error.
    smb encrypt = desired
    # No guest access: the share always asks for credentials.
    map to guest = never
    restrict anonymous = 2
    disable netbios = yes
    server role = standalone server

[@SHARE_NAME@]
    path = @SHARE_PATH_DATA@
    comment = pi-home-stack network storage
    browseable = yes
    read only = no
    guest ok = no
    valid users = @SMB_USER@
    force user = @SMB_USER@
    force group = @SMB_USER@
    # New files belong to the share user and are not readable by anyone else.
    create mask = 0660
    directory mask = 2770
    # Recycle bin: an accidental delete over the network is not immediately
    # final. Costs disk space, saves nerves.
    vfs objects = recycle
    recycle:repository = .recycle
    recycle:keeptree = yes
    recycle:versions = yes
    recycle:touch = yes
    recycle:exclude = *.tmp, *.temp, *.o, *.obj, ~$*
