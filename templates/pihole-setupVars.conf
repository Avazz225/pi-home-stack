# pi-home-stack - pre-seed for the unattended Pi-hole installer.
# Pi-hole v6 keeps its configuration in /etc/pihole/pihole.toml and ignores this
# file; for v5 it is what makes --unattended possible.
PIHOLE_INTERFACE=@PIHOLE_IFACE@
IPV4_ADDRESS=@PIHOLE_CIDR@
IPV6_ADDRESS=
PIHOLE_DNS_1=@PIHOLE_DNS_1@
PIHOLE_DNS_2=@PIHOLE_DNS_2@
QUERY_LOGGING=true
INSTALL_WEB_SERVER=true
INSTALL_WEB_INTERFACE=true
# Stays on; the nginx module then moves the Pi-hole web server to port 8080 and
# republishes it under /admin/, freeing port 80.
LIGHTTPD_ENABLED=true
CACHE_SIZE=10000
DNS_FQDN_REQUIRED=true
DNS_BOGUS_PRIV=true
DNSMASQ_LISTENING=local
BLOCKING_ENABLED=true
