# pi-home-stack - Grafana.
#
# Grafana needs to know it lives under a sub-path, otherwise its own links point
# at the root. That is set as root_url in grafana.ini, not here.

location /grafana/ {
    proxy_pass http://127.0.0.1:@GRAFANA_PORT@/;
    proxy_set_header Host            $host;
    proxy_set_header X-Real-IP       $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Live panels and the explore view use websockets
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";
}
