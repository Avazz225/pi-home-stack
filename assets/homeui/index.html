<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0d0d12" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f4f7" media="(prefers-color-scheme: light)">
<title>Home</title>
<!-- Everything inline and without external dependencies: the page has to work
     when the Pi has no internet connection. -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>🏠</text></svg>">
<link rel="stylesheet" href="style.css">
<script>
  /* Applied before first paint so a dark-mode reload does not flash white. */
  try {
    var saved = localStorage.getItem("pi-home-theme");
    if (saved === "light" || saved === "dark") {
      document.documentElement.setAttribute("data-theme", saved);
    }
  } catch (e) { /* storage blocked - fall back to the system preference */ }
</script>
</head>
<body>
<header>
  <div class="title">
    <h1 id="hostname">Home</h1>
    <span id="model" class="meta"></span>
  </div>
  <div class="controls">
    <span id="updated" class="meta"></span>
    <select id="language" aria-label="Language"></select>
    <button id="theme" type="button" aria-label="Theme"><span id="theme-icon">◐</span></button>
    <button id="refresh" type="button" data-i18n="Refresh">Refresh</button>
  </div>
</header>

<main id="tiles" aria-live="polite">
  <p class="loading" data-i18n="Loading status ...">Loading status ...</p>
</main>

<section class="links">
  <h2 data-i18n="Quick links">Quick links</h2>
  <div id="quicklinks" class="link-grid"></div>
  <form id="link-form" autocomplete="off">
    <input type="text" id="link-label" data-i18n-placeholder="Name" placeholder="Name" required>
    <input type="url" id="link-url" placeholder="https://..." required>
    <button type="submit" data-i18n="Add">Add</button>
  </form>
  <p class="hint" data-i18n="Quick links are stored in this browser only.">Quick links are stored in this browser only.</p>
</section>

<footer>
  <span>pi-home-stack</span>
</footer>

<script src="app.js"></script>
</body>
</html>
