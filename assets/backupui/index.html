<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0d0d12" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f4f7" media="(prefers-color-scheme: light)">
<title>Backup</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>🗄️</text></svg>">
<!-- Design tokens and shared components come from the home interface, so both
     pages stay one visual system. -->
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="backup.css">
<script src="../theme-boot.js"></script>
</head>
<body>
<header>
  <div class="title">
    <a class="back" href="/" data-i18n-title="Back">←</a>
    <h1 data-i18n="Backup">Backup</h1>
    <span id="subtitle" class="meta"></span>
  </div>
  <div class="controls">
    <select id="language" data-i18n-title="Language" aria-label="Language"></select>
    <button id="theme" type="button" aria-label="Theme"><span id="theme-icon">◐</span></button>
    <button id="refresh" type="button" data-i18n="Refresh">Refresh</button>
  </div>
</header>

<nav class="tabs" id="tabs" role="tablist"></nav>

<div id="banner"></div>

<main id="view" aria-live="polite">
  <p class="loading" data-i18n="Loading ...">Loading ...</p>
</main>

<footer>
  <span>pi-home-stack</span>
</footer>

<script src="../common.js"></script>
<script src="app.js"></script>
</body>
</html>
